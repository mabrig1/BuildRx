name: CI

on:
  push:
    branches-ignore:
      - "live-cert/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Type errors were previously only caught by a full `next build`,
      # so a pull request could go green on lint alone.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Generated app certification matrix
        timeout-minutes: 15
        run: npm run certify:generated-app
